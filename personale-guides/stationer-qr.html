<!doctype html>
<html lang="da">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<meta name="robots" content="noindex, nofollow, noarchive, nosnippet" />
<title>Print: QR til stationerne · Personale-guides</title>
<style>
  :root{--ink:#16161a;--mid:#45454d;--muted:#75757e;--line:#e0e0e4;--teal:#0f766e;
    --sans:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;--mono:ui-monospace,Menlo,Consolas,monospace}
  *{box-sizing:border-box}
  body{margin:0;background:#f4f4f6;color:var(--ink);font-family:var(--sans);line-height:1.4}
  .wrap{max-width:820px;margin:0 auto;padding:28px 20px 60px}
  h1{font-size:26px;margin:0 0 4px;letter-spacing:-.3px}
  .lede{color:var(--mid);font-size:14.5px;margin:0 0 4px;max-width:66ch}
  .hint{font-family:var(--mono);font-size:12px;color:var(--muted);margin:10px 0 20px}
  .grid{display:grid;grid-template-columns:1fr 1fr;gap:16px}
  .qcard{background:#fff;border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;gap:16px;align-items:center;break-inside:avoid}
  .qcard .q{width:132px;height:132px;flex:none;display:grid;place-items:center}
  .qcard .q svg{width:132px;height:132px}
  .qcard .m .em{font-size:22px}
  .qcard .m h2{font-size:17px;margin:2px 0 3px;letter-spacing:-.2px}
  .qcard .m p{margin:0;font-size:12.5px;color:var(--mid)}
  .qcard .m .url{font-family:var(--mono);font-size:10.5px;color:var(--muted);margin-top:6px;word-break:break-all}
  .foot{margin-top:22px;font-size:12px;color:var(--muted);font-family:var(--mono)}
  .printbtn{display:inline-block;margin:14px 0 4px;background:var(--teal);color:#fff;border:0;border-radius:9px;padding:10px 16px;font:600 14px var(--sans);cursor:pointer}
  @media print{
    body{background:#fff}.wrap{max-width:none;padding:0}.printbtn{display:none}
    .qcard{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    @page{size:A4 portrait;margin:12mm}
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>QR til stationerne</h1>
  <p class="lede">Hæng et kort op ved hver station. Personalet scanner QR-koden og får guiden op på deres egen telefon. Klip fra hinanden efter print.</p>
  <button class="printbtn" onclick="window.print()">🖨 Print / gem som PDF</button>
  <div class="grid" id="grid"></div>
  <div class="foot">Ringsted Festival 2026 · LiveCloud · personale-guides</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script>
  var BASE = 'https://guides.livecloud.dk/';
  var STATIONS = [
    {em:'🎫', name:'Gate & scanner', file:'haandbog-gates.html', desc:'Ved gaten: scan, to farver, hold køen kørende.'},
    {em:'ℹ️', name:'Information / servicedesk', file:'haandbog-information.html', desc:'Skranken: opslag, check-in, armbånd, billet-problemer.'},
    {em:'🍺', name:'Barer, boder & POS', file:'haandbog-pos.html', desc:'Alt i Beats, optankning, terminal-fejl, eskalering.'},
    {em:'🎟️', name:'Akkreditering', file:'haandbog-akkreditering.html', desc:'Armbånd, zoner, ombind. Staff og artister.'},
    {em:'🏃', name:'Roaming support', file:'haandbog-support.html', desc:'Runnere ude, inde og på camping.'},
    {em:'🧭', name:'Kontakt & ansvar', file:'kontakt-ansvar.html', desc:'Sådan får du fat i LiveCloud. Én indgang.'},
    {em:'📚', name:'Alle guides (oversigt)', file:'index.html', desc:'Hele biblioteket. Vælg din rolle.'}
  ];
  var grid = document.getElementById('grid');
  STATIONS.forEach(function(s){
    var url = BASE + s.file;
    var qr = qrcode(0, 'M'); qr.addData(url); qr.make();
    var card = document.createElement('div'); card.className = 'qcard';
    card.innerHTML =
      '<div class="q">' + qr.createSvgTag({cellSize:4, margin:1}) + '</div>' +
      '<div class="m"><div class="em">' + s.em + '</div><h2>' + s.name + '</h2>' +
      '<p>' + s.desc + '</p><p>Scan for at åbne guiden på din telefon.</p>' +
      '<div class="url">' + url + '</div></div>';
    grid.appendChild(card);
  });
</script>
</body>
</html>
